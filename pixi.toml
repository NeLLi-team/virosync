# ViroSync: Framework for discovering ancient viral elements in eukaryotic genomes
# Configuration for pixi package manager

[workspace]
name = "virosync"
version = "1.0.2"
description = "Framework for discovering and characterizing ancient viral elements (EVEs) in eukaryotic genomes"
authors = ["ViroSync Development Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# Python runtime
python = "==3.11.14"

# Core scientific libraries
numpy = "==2.2.6"
pandas = "==2.2.3"
scipy = "==1.16.3"
biopython = "==1.86"

# Report runtime
matplotlib-base = "==3.10.8"
ipython = "==9.10.0"
ipykernel = "==7.2.0"
nbformat = "==5.10.4"
# Node.js runs the Syntviz renderer for the report's gene-neighborhood figure.
nodejs = "==22.23.1"

# CLI and utilities
click = "==8.3.1"
pyyaml = "==6.0.3"
tqdm = "==4.67.1"
psutil = "==7.1.3"

# Bioinformatics Python bindings
pyhmmer = "==0.11.3"

# Bioinformatics CLI tools
diamond = "==2.2.1"
skani = "==0.2.0"
genometools-genometools = "==1.6.6"

# Core modeling utilities
networkx = "==3.6.1"
# graphviz supplies the sfdp binary; python-graphviz the binding the EVE
# report's ANI network figure renders with.
graphviz = "==14.1.2"
python-graphviz = "==0.21"

[pypi-dependencies]
# Notebook report generation (per-genome EVE report is Jupyter-only via jupytext)
papermill = "==2.6.0"
jupytext = "==1.19.3"
# Interactive gene-neighborhood figure in the EVE report.
syntviz = "==0.2.0"

[tasks]
# Unified CLI entrypoint.  Bare `-i/-o` invocations are auto-forwarded to
# `run` by the CLI, so all subcommands work through this single task:
#   pixi run virosync run -i <input> -o <output>       → run pipeline
#   pixi run virosync -i <input> -o <output>            → run pipeline (shortcut)
#   pixi run virosync orchestrate setup ...             → setup
#   pixi run virosync info                              → system info
virosync = "PYTHONPATH=src python -m virosync.cli.main"
setup-prodigal-gv = "PYTHONPATH=src python -m virosync.utils.prodigal_runtime setup"

# === Main Pipeline ===
run = { cmd = "PYTHONPATH=src python -m virosync.cli.main run", depends-on = ["setup-databases", "setup-prodigal-gv"] }

# === Example / Quick Start ===
# Example genomes shipped in example/
example = { cmd = "PYTHONPATH=src python -m virosync.cli.main run -i example/ -o results/example/ --config config/orchestration.yaml -w 1 --threads-per-worker 8 --clean-run", depends-on = ["setup-databases", "setup-prodigal-gv"] }
example-frameshift = { cmd = "PYTHONPATH=src python -m virosync.cli.main run -i example/frameshift/trichomonas-g3.fna -o results/example-frameshift/ --config config/orchestration.yaml -w 1 --threads-per-worker 8 --frameshift-screening --clean-run", depends-on = ["setup-databases", "setup-prodigal-gv"] }

# === Database Setup ===
# Provision resources (downloads + config path updates) and then validate DB files.
# Override installation target by setting VIROSYNC_DB_ROOT.
# When VIROSYNC_DB_ROOT is unset we avoid rewriting config on every pipeline run.
setup-virosync-resources = "PYTHONPATH=src python -m virosync.cli.main orchestrate setup --config config/orchestration.yaml --no-interactive-optional --no-write-config"
setup-databases = { cmd = "echo 'ViroSync resource setup complete.'", depends-on = ["setup-virosync-resources"] }
check-structural-runtime = "PYTHONPATH=src python scripts/check_structural_runtime.py --config config/orchestration.yaml"

check-production-ready = "python scripts/ci/check_production_ready.py"
# Usage: pixi run check-tsv-invariants --detailed-tsv <run>/<genome>/virosync_predictions_detailed.tsv
check-tsv-invariants = "PYTHONPATH=src python scripts/check_tsv_invariants.py"

[feature.openblas.dependencies]
# Keep the CPU runtime independent of the development PyTorch MKL build.
libblas = { version = "==3.11.0", build = "*openblas" }

[feature.dev.dependencies]
pytest = "==9.0.2"
ruff = "==0.15.21"
mypy = "==1.19.1"
pre-commit = "==4.5.1"
pytorch-cpu = "==2.9.1"

[feature.dev.tasks]
lint = "ruff check src tests scripts && ruff format --check src tests scripts src/virosync/report/eve_analysis.py"

[feature.optional.dependencies]
trf = "==4.10.0rc2"
repeatmasker = "==4.2.2"
scikit-learn = "==1.8.0"
xgboost = { version = "==3.2.0", build = "cpu_*" }

[feature.structural.dependencies]
foldseek = "==10.941cd33"
# Torch requires setuptools; retain the locked version in this runtime.
setuptools = "==82.0.0"

[feature.structural.pypi-dependencies]
# GPU runtime for optional TMVec structural similarity.
# Boltz is kept in tools/boltz_runtime/pixi.toml because its dependency stack
# drifts independently from the main ViroSync runtime.
torch = "==2.9.1"
transformers = "==4.44.2"
lbster = { git = "https://github.com/prescient-design/lobster.git", rev = "85794b9963e1e0bae1d6261d31e2f529cf62ad18" }

[feature.docs.dependencies]
python = "==3.11.14"
mkdocs = "==1.6.1"
mkdocs-material = "==9.7.7"
pymdown-extensions = "==11.0.1"

[feature.docs.tasks]
docs-build = "mkdocs build --strict"
docs-serve = "mkdocs serve"

# NOTE: Shared workstation - use max 48 threads (of 64 available)

[environments]
default = { features = ["openblas"], solve-group = "cpu" }
optional = { features = ["optional", "openblas"], solve-group = "cpu" }
dev = { features = ["dev", "optional"] }
structural = { features = ["structural", "optional", "openblas"] }
docs = { features = ["docs"], no-default-feature = true }
