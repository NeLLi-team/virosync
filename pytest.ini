[pytest]
# Keep test discovery constrained to the tracked unit/integration-lite suite.
testpaths = tests
norecursedirs = DEL .git .pixi .pytest_cache benchmark* final temp
# Put the repo root on sys.path so tests that import the top-level `benchmarking`
# and `scripts` helpers collect under a bare `pytest`, not only `python -m pytest`.
pythonpath = .
