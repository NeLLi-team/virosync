compute:
  threads: 16
  max_threads: 48
  device: cpu
  search_backend: diamond
  gene_taxonomy_threads: null
  interproscan_threads: 4

host:
  label: ARC
  prefixes:
    - ARC__
  high_pident_threshold: 70.0

phase1:
  rebuild_db: false
  assembly_mode: default
  hmm_chunk_size: null
  # Requires BATH; see docs/FRAMESHIFT_SCREENING.md.
  frameshift_screening_enabled: false
  initial_window_bp: 10000
  initial_window_genes: 5
  min_markers_initial: 1
  extension_kb: 5
  merge_distance: 1000
  # Disabled: identify_host_deviation_markers and filter_deviation_seed_markers
  # were never implemented, so enabling this raises ImportError at the start of
  # Phase 1 and the run processes nothing. The tuned keys below are kept as the
  # record of the intended design.
  host_taxonomy_deviation_enabled: false
  host_taxonomy_deviation_allow_seeds: true
  host_taxonomy_deviation_min_token_len: 6
  host_taxonomy_deviation_min_tokens: 3
  host_taxonomy_deviation_overlap_threshold: 0.3
  host_taxonomy_deviation_max_pident: 70.0
  host_taxonomy_deviation_max_hits: 5
  host_taxonomy_deviation_window_bp: 5000
  host_taxonomy_deviation_window_count: 25
  host_taxonomy_deviation_window_seed: 13
  host_taxonomy_deviation_window_min_markers: 1
  host_taxonomy_deviation_seed_window_bp: 10000
  host_taxonomy_deviation_seed_min_markers: 3
  marker_validation_top_k: 10
  novel_marker_min_score: 30.0
  novel_marker_min_coverage: 0.5
  novel_marker_require_cluster: true

phase2:
  taxonomy_weight_mode: rank
  taxonomy_ml_enabled: false
  taxonomy_ml_model: logreg
  taxonomy_ml_threshold: 0.5
  taxonomy_ml_neighbor_window: 3
  host_trim_enabled: true
  host_trim_window_bp: 5000
  host_trim_step_bp: 1000
  host_trim_max_host_fraction: 0.3
  host_trim_min_viral_fraction: 0.05
  host_trim_score_threshold: 0.5
  host_trim_buffer_kb: 5
  host_signature_min_token_len: 6
  host_trim_min_overlap_score: 0.4
  diamond_flank_genes: 10
  diamond_control_sample_size: 100
  diamond_control_min_distance: 30
  diamond_top_k: 10
  diamond_chunk_size: 10000
  diamond_random_seed: 42

phase3:
  host_signature_evidence_threshold: 0.3
  high_tier_threshold: 0.8
  low_tier_threshold: 0.4
  use_crf_in_final_score: false
  priority_marker_list:
    - mcp
  marker_floor_priority_only: 0.55
  marker_floor_priority_plus_family: 0.7
  marker_floor_priority_multi_family: 0.8
  marker_family_bonus_per_family: 0.06
  marker_multi_family_bonus: 0.08
  enable_phylogenetic: false
  skip_structural: true
  use_boltz: false
  boltz_mcp_only: true
  boltz_use_msa_server: false
  boltz_min_seq_len: 100
  boltz_max_seq_len: 1000
  boltz_no_kernels: true
  use_tmvec_database: false
  tmvec_require_gpu: false
  tmvec_databases:
    - bfvd
  tmvec_database_dir: null
  tmvec_min_score: 0.5
  viral_structure_db: null
  extended_output: true
  export_all_eve_sequences: true
  interproscan_enabled: false
  interproscan_dir: null
  interproscan_keywords:
    - viral
    - virion
    - virophage
    - capsid
    - major capsid
    - mcp
    - portal
    - terminase
    - packaging
    - ncldv
    - mirus
    - pox
    - polymerase
    - helicase
    - transcription factor
    - vltf
  interproscan_applications:
    - Pfam
  run_gvclass: false
  gvclass_path: null

execution:
  masking:
    backend: "off"
    failure_policy: strict
    fallback_backend: null
    repeatmasker_species: null
    repeatmasker_library: null
  resume: true
