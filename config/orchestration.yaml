schema_version: 1
orchestration:
  database_root: null
  core_resources_url: https://dl.newlineages.com/virosync/resources_v1_3_0_runtime.tar.gz
  core_resources_version: v1.3.0
  core_resources_sha256: c62b364f9b89a813444066544a2f5166c3caecc0cb80f86ae580d4f31c6b1c37
  core_resources_manifest_sha256: b61106b85e7584c7b6064edd192a7d30563a7876ad5b814630032ff619b85354
  tmvec_resources_url: https://dl.newlineages.com/virosync/virosync_tmvec2_resources_v1.0.0.tar.gz
  tmvec_resources_sha256: 2167621975719b607f8da9b9a9a6dcc03a18b5cedbb58a7dc6f9cf039757bba6
  interproscan_resources_url: null
  interproscan_resources_sha256: null
  max_concurrent_genomes: 6
  retries: 1
  retry_delay_seconds: 60
  gpu_id: null
ablation:
  id: A0
  contract_sha256: bcde3b3053760d897e1756454038e0ba8aa5bf75148e0c6eabc56cb080653bd2
databases:
  hmm_database: null
  hmm_allowlist: null
  marker_faa_dir: null
  marker_faa_db: null
  marker_db: null
  seed_marker_allowlist: null
  gene_taxonomy_faa_db: null
  faa_dir: null
  gvclass_db: null
  diamond_db: null
  taxonomy_labels_file: null
compute:
  threads: 8
  max_threads: 48
  device: cpu
  search_backend: diamond
  gene_taxonomy_threads: null
  interproscan_threads: 4
host:
  prefixes:
  - EUK__
  - MITO__
  - PLASTID__
  label: EUK
  high_pident_threshold: 70.0
  # Reference masking (docs/METHODS.md, "Reference masking"): searches ignore hits
  # to the genome's own assembly and to the genomes of the listed taxa.
  mask_own_assembly: true
  reference_mask_taxa: []
  self_reference_keys: []
phase1:
  rebuild_db: false
  assembly_mode: default
  hmm_chunk_size: null
  # Native codon-aware rescue; see docs/FRAMESHIFT_SCREENING.md.
  frameshift_screening_enabled: false
  initial_window_bp: 10000
  initial_window_genes: 5
  min_markers_initial: 1
  extension_kb: 5
  merge_distance: 1000
  host_taxonomy_deviation_enabled: false
  host_taxonomy_deviation_allow_seeds: false
  host_taxonomy_deviation_min_token_len: 6
  host_taxonomy_deviation_min_tokens: 3
  host_taxonomy_deviation_overlap_threshold: 0.3
  host_taxonomy_deviation_max_pident: 70.0
  host_taxonomy_deviation_max_hits: 5
  host_taxonomy_deviation_window_bp: 5000
  host_taxonomy_deviation_window_count: 25
  host_taxonomy_deviation_window_seed: 13
  host_taxonomy_deviation_window_min_markers: 1
  host_taxonomy_deviation_seed_window_bp: 10000
  host_taxonomy_deviation_seed_min_markers: 3
  marker_validation_top_k: 10
  novel_marker_min_score: 30.0
  novel_marker_min_coverage: 0.5
  novel_marker_require_cluster: true
phase2:
  taxonomy_weight_mode: rank
  taxonomy_ml_enabled: false
  taxonomy_ml_model: logreg
  taxonomy_ml_threshold: 0.5
  taxonomy_ml_neighbor_window: 3
  host_trim_enabled: true
  # Share of a gene's ten hits inside the host's own lineage, not a Jaccard.
  host_trim_score_threshold: 0.35
  host_signature_min_token_len: 3
  diamond_flank_genes: 10
  diamond_control_sample_size: 100
  diamond_control_min_distance: 30
  diamond_top_k: 10
  diamond_chunk_size: 10000
  diamond_random_seed: 42
  # Independent veto-search depth when >10; original top10 search stays unchanged.
  # A qualifying hit (>=25% identity) vetoes host status. At least 10.
  viral_hit_depth: 50
phase3:
  host_signature_evidence_threshold: 0.3
  high_tier_threshold: 0.7
  low_tier_threshold: 0.2
  use_crf_in_final_score: false
  enable_phylogenetic: false
  skip_structural: true
  use_boltz: false
  boltz_mcp_only: true
  boltz_use_msa_server: false
  boltz_min_seq_len: 100
  boltz_max_seq_len: 1000
  boltz_no_kernels: true
  use_tmvec_database: false
  tmvec_require_gpu: false
  tmvec_databases:
  - bfvd
  tmvec_database_dir: null
  tmvec_min_score: 0.5
  viral_structure_db: null
  extended_output: true
  export_all_eve_sequences: true
  interproscan_enabled: false
  interproscan_dir: null
  interproscan_keywords:
  - viral
  - virion
  - virophage
  - capsid
  - major capsid
  - mcp
  - portal
  - terminase
  - packaging
  - ncldv
  - mirus
  - pox
  - polymerase
  - helicase
  - transcription factor
  - vltf
  interproscan_applications:
  - Pfam
  run_gvclass: false
  gvclass_path: null
execution:
  masking:
    backend: 'off'
    failure_policy: strict
    fallback_backend: null
    repeatmasker_species: null
    repeatmasker_library: null
  resume: true
