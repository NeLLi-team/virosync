name: example-smoke

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # weekly, Mondays 09:17 UTC
  # Runs on the self-hosted `nelli-gpu` runner, which has the ViroSync resource
  # bundle provisioned (VIROSYNC_CI_RESOURCES in the runner's .env), so it skips
  # the multi-GB download and runs the real end-to-end example weekly and for
  # release tags. PR gating remains the `tests` workflow.

permissions:
  contents: read

jobs:
  example:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, nelli-gpu]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install authenticated Pixi
        run: bash scripts/ci/install_pixi.sh

      - name: Install locked environment
        run: pixi install --locked

      - name: Fully verify provisioned resources
        env:
          EXPECTED_DB_VERSION: v1.0.7
        run: |
          test -n "$VIROSYNC_CI_RESOURCES" || { echo "VIROSYNC_CI_RESOURCES not set on this runner"; exit 1; }
          test -f "$VIROSYNC_CI_RESOURCES/DB_VERSION" || { echo "resources not found at $VIROSYNC_CI_RESOURCES"; exit 1; }
          found="$(cat "$VIROSYNC_CI_RESOURCES/DB_VERSION")"
          test "$found" = "$EXPECTED_DB_VERSION" || { echo "provisioned DB_VERSION '$found' != expected '$EXPECTED_DB_VERSION'"; exit 1; }
          printf 'VIROSYNC_DB_ROOT=%s\n' "$VIROSYNC_CI_RESOURCES" >> "$GITHUB_ENV"
          pixi run virosync orchestrate resources verify \
            --config config/orchestration.yaml \
            --db-root "$VIROSYNC_CI_RESOURCES" \
            --full
          echo "Provisioned resources passed full v1.0.7 verification."

      - name: Run clean shipped example
        run: |
          pixi run virosync \
            -i example/ \
            -o results/ci_example \
            --config config/orchestration.yaml \
            -w 1 \
            --threads-per-worker 4 \
            --clean-run

      - name: Validate clean completion artifacts
        run: |
          pixi run python scripts/ci/validate_example_run.py \
            results/ci_example \
            --write-snapshot "$RUNNER_TEMP/virosync-example-snapshot.json" \
            --expect-predictions 6 \
            --expect-accepted 1
          pixi run python scripts/ci/check_coordinate_outputs.py results/ci_example

      - name: Run unchanged resume
        run: |
          pixi run virosync \
            -i example/ \
            -o results/ci_example \
            --config config/orchestration.yaml \
            -w 1 \
            --threads-per-worker 4

      - name: Validate unchanged resume parity
        run: |
          pixi run python scripts/ci/validate_example_run.py \
            results/ci_example \
            --compare-snapshot "$RUNNER_TEMP/virosync-example-snapshot.json" \
            --require-resume \
            --expect-predictions 6 \
            --expect-accepted 1
          pixi run python scripts/ci/check_coordinate_outputs.py results/ci_example

      - name: Build pinned BATH runtime
        run: |
          bath_root="$(mktemp -d "$RUNNER_TEMP/virosync-bath.XXXXXX")"
          git clone https://github.com/TravisWheelerLab/BATH.git "$bath_root/BATH"
          git -C "$bath_root/BATH" checkout 7842ebd58b96591b4b60863ee5c33e49eb79eccc
          git clone https://github.com/EddyRivasLab/easel.git "$bath_root/BATH/easel"
          git -C "$bath_root/BATH/easel" checkout 0f4e71832d6ba1e4c65039ba4b4663c546a041fa
          cd "$bath_root/BATH"
          autoconf
          ./configure --prefix="$bath_root/runtime"
          make -j 4
          make check
          make install
          export PATH="$bath_root/runtime/bin:$PATH"
          bathconvert -h >/dev/null
          bathsearch -h >/dev/null
          printf '%s\n' "$bath_root/runtime/bin" >> "$GITHUB_PATH"

      - name: Run clean frameshift example
        run: |
          pixi run virosync \
            -i example/frameshift/trichomonas-g3.fna \
            -o results/ci_example_frameshift \
            --config config/orchestration.yaml \
            -w 1 \
            --threads-per-worker 8 \
            --frameshift-screening \
            --clean-run

      - name: Validate frameshift completion artifacts
        run: |
          pixi run python scripts/ci/validate_example_run.py \
            results/ci_example_frameshift \
            --expect-predictions 5 \
            --expect-accepted 2 \
            --expect-canonical-eve-id EVE_DS113200.1_129184-151689 \
            --expect-canonical-eve-id EVE_DS113495.1_58468-89417 \
            --expect-detailed-eve-id EVE_DS113200.1_129184-151689 \
            --expect-detailed-eve-id EVE_DS113495.1_2-471 \
            --expect-detailed-eve-id EVE_DS113389.1_48748-50484 \
            --expect-detailed-eve-id EVE_DS113495.1_58468-89417 \
            --expect-detailed-eve-id EVE_DS113200.1_26626-27034
          pixi run python scripts/ci/check_coordinate_outputs.py results/ci_example_frameshift
          test -s results/ci_example_frameshift/*/phase1/frameshift_screening/confirmed_frameshift_markers.tsv
          awk 'END { exit NR < 2 }' results/ci_example_frameshift/*/phase1/frameshift_screening/confirmed_frameshift_markers.tsv
          test -s results/ci_example_frameshift/*/phase1/frameshift_screening/confirmed_frameshift_proteins.faa
          grep -h -q '^>.*_VSR' results/ci_example_frameshift/*/phase3_synthesis/gvclass_input/protein/*.faa

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virosync-example-smoke
          path: |
            results/ci_example/batch_summary.tsv
            results/ci_example/batch_report.md
            results/ci_example/*/phase3_synthesis/virosync_summary.json
            results/ci_example_frameshift/batch_summary.tsv
            results/ci_example_frameshift/*/phase1/frameshift_screening/confirmed_frameshift_markers.tsv
            results/ci_example_frameshift/*/phase3_synthesis/virosync_summary.json
