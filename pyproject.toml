[build-system]
requires = ["setuptools==79.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "virosync"
version = "1.0.1"
description = "Framework for discovering and characterizing ancient viral elements in eukaryotic genomes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "ViroSync Development Team" }
]

[project.scripts]
virosync = "virosync.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virosync = ["data/integration_profiles.hmm", "data/integration_profiles.json", "data/prodigal_gv/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Report notebooks share globals across cells, which static analysis cannot see;
# exclude them from the correctness lint.
extend-exclude = [
    "src/virosync/report/eve_analysis.py",
]

[tool.ruff.lint]
# Check correctness, import order, modern syntax and docstring spacing.
select = ["E9", "F", "I", "UP", "D202", "D212"]
# StrEnum changes str(member), which is observable for existing public enums.
ignore = ["UP042"]
